<!DOCTYPE html>
<html lang="ru" data-theme="obsidian">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Borozdov</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
        (function () {
            try {
                document.documentElement.dataset.theme =
                    window.matchMedia('(prefers-color-scheme: light)').matches ? 'titan' : 'obsidian';
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root, :root[data-theme="obsidian"] {
            color-scheme: dark;
            --canvas: #0d0d0d;
            --hairline: #2e2e2e;
            --slate: #8a8a8a;
            --ink: #fafafa;
        }
        :root[data-theme="titan"] {
            color-scheme: light;
            --canvas: #fafafa;
            --hairline: #e4e4e4;
            --slate: #6b6b6b;
            --ink: #0d0d0d;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--canvas);
            color: var(--ink);
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 2rem;
        }
        ::selection { background: var(--ink); color: var(--canvas); }
        .code {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: clamp(5rem, 20vw, 12rem);
            line-height: 1;
        }
        .label {
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-weight: 500;
            font-size: 0.75rem;
            color: var(--slate);
            margin-top: 1.5rem;
        }
        .quote {
            max-width: 34rem;
            margin-top: 2rem;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--slate);
        }
        a {
            display: inline-block;
            margin-top: 3rem;
            background: var(--ink);
            color: var(--canvas);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.02em;
            font-size: 0.875rem;
            border-radius: 4px;
            padding: 0.875rem 1.5rem;
            transition: filter 0.15s ease;
        }
        a:hover { filter: brightness(0.85); }
    </style>
</head>
<body>
    <div class="code">404</div>
    <div class="label">Страница не найдена</div>
    <p class="quote">«Трудно найти чёрную кошку в тёмной комнате, особенно если её там нет». То же самое касается и этой страницы.</p>
    <a href="/">На главную</a>
</body>
</html>
